name: macOS build

on:
  push:
    branches: [main]
    paths:
      - 'macos/**'
      - '.github/workflows/macos-build.yml'
  pull_request:
    paths:
      - 'macos/**'
      - '.github/workflows/macos-build.yml'

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Swift version
        run: swift --version

      - name: Build Apple Silicon
        run: swift build --package-path macos -c release --arch arm64

      - name: Build Intel
        run: swift build --package-path macos -c release --arch x86_64

      - name: Create universal binary
        run: |
          mkdir -p macos/.build/universal
          lipo -create \
            macos/.build/arm64-apple-macosx/release/blueaudioswitch-mac \
            macos/.build/x86_64-apple-macosx/release/blueaudioswitch-mac \
            -output macos/.build/universal/blueaudioswitch-mac
          lipo -info macos/.build/universal/blueaudioswitch-mac
          file macos/.build/universal/blueaudioswitch-mac

      - name: Smoke test
        run: macos/.build/universal/blueaudioswitch-mac --version
